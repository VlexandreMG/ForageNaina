# Nom de l'application
spring.application.name=demo

# Configuration MySQL
# 'mysql-container' doit correspondre au nom du service dans ton docker-compose.yml
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/forage?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Affiche absolument tout ce que Spring fait au démarrage
logging.level.org.springframework.web=DEBUG
# Affiche les détails de Thymeleaf (si c'est un problème de fichier HTML)
logging.level.org.thymeleaf=DEBUG