<h2>Formulaire d'ajout de demande : </h2>

<form th:action="@{/demandes/save}" th:object="${demande}" method="post">
    <input type="number" th:field="*{client.id}" placeholder="Client"/>
    <input type="number" th:field="*{commune.id}" placeholder="Commune"/>
    <input type="text" th:field="*{lieu}" placeholder="Lieu"/>

    <button type="submit">Enregistrer</button>
</form>

<a th:href="@{/demandes/test}">Ajout devis </a>
